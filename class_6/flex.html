<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexBox</title>
    <style>
        .container{
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            background-color: aqua;
            height: 100vh;
            align-items: center;
            /* align-content: center; */
        }
        .box1{
            background-color: blue;
            color: white;
            height: 200px;
            width: 300px;
            border: 2px solid black;
            order: 2;
            /* align-self: flex-end; */
            flex-grow: 1;
        }
        .box2{
            background-color: red;
            color: white;
            height: 200px;
            width: 300px;
            border: 2px solid black;
            flex-grow: 2;
        }
        
    </style>
</head>
<body>
    <div class="container">
        <div class="box1">Box1A</div>
        <div class="box1">Box1B</div>
        <div class="box2">Box2A</div>
        <div class="box2">Box2B</div>
    </div>
</body>
</html>

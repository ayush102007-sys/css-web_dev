<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Queries</title>
    <style>
        .container{
            background-color: red;
            height: 50vh;
        }
        @media screen and (max-width: 800px) {
            body{
                background-color: black;
            }
            .container{
                background-color: blue;
                color: white;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Recusandae placeat voluptatem illo ex eaque, id nostrum perspiciatis quidem voluptates accusamus debitis incidunt corporis blanditiis, saepe ipsum! Ipsa minus et voluptatibus?
    </div>
</body>
</html>

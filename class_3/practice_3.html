<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice - Class 3</title>
    <style>

        h1{
            background-color: rgb(54, 54, 207);
        }
        .dashboard{
            background-color: whitesmoke;
            color: black;
            margin: 2px;
            padding: 1px;
            height: 250px;
            width: 1232px;
        }
        .tickets{
            color: rgb(58, 21, 21);
            border: 1px solid rgb(193, 56, 56);
            width: 100%;
            box-sizing: border-box;
        }
        footer{
            background-color: rgb(177, 31, 177);
        }
    </style>
</head>
<body>
    <header>
        <h1>
            <center>Tickets To Your Destination</center> 
        </h1>
    </header>

    <main>
        <div class="dashboard">
            <center><p>Book your tickets from here.</p></center>
            <div class="tickets">
               <center>
                <p>
                     <a href="https://www.irctc.co.in/" target="_blank">Book Tickets</a>
                </p>
               </center>
            </div>
        </div>
    </main>

    <footer>
        <center><b>Get Connected with our social networks.</b></center>
    </footer>
</body>
</html>
